name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"

      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
        run: gradle assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx2g

      - name: Build debug APK (no signing key)
        if: env.KEYSTORE_BASE64 == ''
        run: gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx2g

      - uses: actions/upload-artifact@v4
        with:
          name: shlagbaumy-apk
          path: app/build/outputs/apk/**/*.apk
